<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Company Sign Up - StaySense</title>
  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Custom CSS Overrides -->
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body class="d-flex align-items-center py-5 bg-body-tertiary min-vh-100">

<main class="w-100 m-auto" style="max-width: 500px;">
  <div class="card shadow-lg border-0 rounded-4 glass-panel">
    <div class="card-body p-5">
      <div class="text-center mb-4">
        <h1 class="h3 mb-1 fw-bold text-gradient">StaySense</h1>
        <p class="text-muted small">Company Registration</p>
      </div>

      {% if error %}
        <div class="alert alert-danger py-2 text-center shadow-sm" role="alert">
          {{ error }}
        </div>
      {% endif %}

      <form action="/signup" method="POST">
        <div class="row g-3 mb-3">
          <div class="col-12">
            <label class="form-label small text-muted mb-1">Company Name</label>
            <input type="text" class="form-control bg-dark border-secondary" name="company_name" required>
          </div>
          <div class="col-12">
            <label class="form-label small text-muted mb-1">Company Email</label>
            <input type="email" class="form-control bg-dark border-secondary" name="company_email" required>
          </div>
        </div>

        <div class="row g-3 mb-3">
          <div class="col-12">
            <label class="form-label small text-muted mb-1">Admin Name</label>
            <input type="text" class="form-control bg-dark border-secondary" name="admin_name" required>
          </div>
          <div class="col-12">
            <label class="form-label small text-muted mb-1">Admin Username (Email)</label>
            <input type="email" class="form-control bg-dark border-secondary" name="username" required>
          </div>
        </div>

        <div class="row g-3 mb-4">
          <div class="col-sm-6">
            <label class="form-label small text-muted mb-1">Password</label>
            <input type="password" class="form-control bg-dark border-secondary" name="password" required>
          </div>
          <div class="col-sm-6">
            <label class="form-label small text-muted mb-1">Confirm Password</label>
            <input type="password" class="form-control bg-dark border-secondary" name="confirm_password" required>
          </div>
        </div>

        <button class="btn btn-primary w-100 py-2 fw-bold shadow" type="submit">Sign Up</button>
      </form>
      
      <p class="mt-4 mb-0 text-center text-muted small">
        Already have an account? <a href="/login" class="text-decoration-none fw-semibold">Login here</a>
      </p>
    </div>
  </div>
</main>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
