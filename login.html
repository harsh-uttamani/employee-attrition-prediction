<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - StaySense</title>
  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Custom CSS Overrides -->
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body class="d-flex align-items-center py-5 bg-body-tertiary min-vh-100">

<main class="form-signin w-100 m-auto" style="max-width: 400px;">
  <div class="card shadow-lg border-0 rounded-4 glass-panel">
    <div class="card-body p-5">
      <div class="text-center mb-4">
        <h1 class="h3 mb-1 fw-bold text-gradient">StaySense</h1>
        <p class="text-muted small">Employee Attrition Prediction System</p>
      </div>

      <h2 class="h5 mb-4 fw-normal text-center">Please log in</h2>

      {% if error %}
        <div class="alert alert-danger py-2 text-center shadow-sm" role="alert">
          {{ error }}
        </div>
      {% endif %}

      <form action="/login" method="POST">
        <div class="form-floating mb-3">
          <input type="email" class="form-control bg-dark border-secondary" id="floatingInput" name="username" placeholder="name@example.com" required>
          <label for="floatingInput" class="text-muted">Username (Email)</label>
        </div>
        <div class="form-floating mb-4">
          <input type="password" class="form-control bg-dark border-secondary" id="floatingPassword" name="password" placeholder="Password" required>
          <label for="floatingPassword" class="text-muted">Password</label>
        </div>

        <button class="btn btn-primary w-100 py-2 fw-bold shadow" type="submit">Log In</button>
      </form>
      
      <p class="mt-4 mb-0 text-center text-muted small">
        New company? <a href="/signup" class="text-decoration-none fw-semibold">Register here</a>
      </p>
    </div>
  </div>
</main>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
